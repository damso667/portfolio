<!-- ============================================================
     footer.component.html — Pied de page
     ============================================================ -->

<footer class="footer">
  <div class="container">

    <!-- ── Partie supérieure : Logo + Liens + Socials ── -->
    <div class="footer-top">

      <!-- ── Colonne 1 : Logo + description ── -->
      <div class="footer-brand">
        <button class="footer-logo" (click)="scrollToTop()" [attr.aria-label]="i18n.t().footer.backTop">
          <span class="logo-first">Noubam Adrien</span>
          <!-- <span class="logo-last">Adrien</span> -->
          <!-- <span class="logo-dot"></span> -->
        </button>
        <p class="footer-tagline">{{ i18n.t().footer.tagline }}</p>
      </div>

      <!-- ── Colonne 2 : Navigation rapide ── -->
      <div class="footer-links">
        <h4 class="footer-heading">{{ i18n.t().footer.navTitle }}</h4>
        <ul class="footer-link-list">
          <li *ngFor="let link of quickLinks">
            <button class="footer-link" (click)="navigateTo(link.anchor)">
              {{ i18n.t().nav[link.key] }}
            </button>
          </li>
        </ul>
      </div>

      <!-- ── Colonne 3 : Réseaux sociaux ── -->
      <div class="footer-socials">
        <h4 class="footer-heading">{{ i18n.t().footer.findMe }}</h4>
        <div class="footer-social-list">
          <a
            *ngFor="let social of socialLinks"
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            class="footer-social-link"
            [attr.aria-label]="i18n.t().hero[social.ariaKey]">
            <i [class]="social.icon"></i>
          </a>
        </div>
      </div>

    </div>

    <!-- ── Séparateur ── -->
    <div class="footer-divider" aria-hidden="true"></div>

    <!-- ── Partie inférieure : Copyright + Liens légaux + Retour en haut ── -->
    <div class="footer-bottom">

      <!-- Copyright avec année dynamique -->
      <p class="footer-copyright">
        © {{ currentYear }} Noubam Adrien. {{ i18n.t().footer.rights }}
      </p>

      <!-- Lien politique de confidentialité (placeholder) -->
      <a href="#" class="footer-legal">{{ i18n.t().footer.privacy }}</a>

      <!-- Bouton retour en haut -->
      <button class="back-to-top" (click)="scrollToTop()" [attr.aria-label]="i18n.t().footer.backTop">
        <i class="fa-solid fa-arrow-up"></i>
      </button>

    </div>

  </div>
</footer>
