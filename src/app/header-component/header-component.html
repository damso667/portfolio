<!-- ============================================================
     header-component.html — HUD de navigation

     Trois îlots flottants, détachés du bord de l'écran :
       1. la marque           (coin gauche)
       2. le dock des sections (centre sur PC, bas d'écran sur mobile)
       3. les actions          (coin droit)

     Le header lui-même ne capte aucun pointeur : le décor 3D
     reste sensible au curseur entre les îlots.
     ============================================================ -->

<header class="hud" [class.is-scrolled]="isScrolled">
  <div class="hud-row">

    <!-- ══════════ ÎLOT 1 — MARQUE ══════════ -->
    <button
      type="button"
      class="hud-island hud-brand"
      (click)="navigateTo('accueil')"
      [attr.aria-label]="i18n.t().nav.brandAria">

      <!-- Monogramme : jeton biseauté (même découpe que les îlots)
           contenant une invite de commande. -->
      <svg class="brand-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 2h16v16l-4 4H2V6z" />
        <path d="m9.6 9.2 2.9 2.9-2.9 2.9" />
        <path d="M14.6 15.1h3.8" />
      </svg>

      <span class="brand-word">
        <span class="brand-name">QALF</span><span class="brand-suffix">Dev</span>
      </span>
    </button>

    <!-- ══════════ ÎLOT 2 — DOCK DES SECTIONS ══════════ -->
    <nav class="hud-island hud-dock" [attr.aria-label]="i18n.t().nav.aria">

      <!-- Marqueur qui glisse jusqu'à la section visible (PC) -->
      <span
        class="nav-marker"
        [class.is-ready]="markerReady"
        [style.transform]="'translate3d(' + markerX + 'px, 0, 0)'"
        [style.width.px]="markerW"
        aria-hidden="true"></span>

      <ul #rail class="nav-rail">
        @for (link of navLinks; track link.anchor) {
          <li>
            <button
              #tab
              type="button"
              class="nav-tab"
              [class.is-active]="isActive(link.anchor)"
              [attr.aria-current]="isActive(link.anchor) ? 'true' : null"
              (click)="navigateTo(link.anchor)">
              <i class="nav-icon {{ link.icon }}" aria-hidden="true"></i>
              <span class="nav-label">{{ i18n.t().nav[link.key] }}</span>
            </button>
          </li>
        }
      </ul>
    </nav>

    <!-- ══════════ ÎLOT 3 — ACTIONS ══════════ -->
    <div class="hud-island hud-actions">

      <!-- Télécharger le CV -->
      <a
        href="/CV_Noubam_Njassine.pdf"
        download
        class="hud-action hud-cv"
        [attr.aria-label]="i18n.t().nav.cvAria">
        <i class="fa-solid fa-download" aria-hidden="true"></i>
        <span class="hud-action-label">CV</span>
      </a>

      <span class="hud-split" aria-hidden="true"></span>

      <!-- Bascule de la langue : affiche la langue vers laquelle on passe -->
      <button
        type="button"
        class="hud-action hud-lang"
        (click)="onLangToggle()"
        [attr.aria-label]="i18n.t().nav.langSwitch"
        [attr.title]="i18n.t().nav.langSwitch"
        [attr.lang]="i18n.lang() === 'fr' ? 'en' : 'fr'">
        <!-- Les deux drapeaux : celui de la langue active est mis en avant -->
        <span class="flag" [class.is-on]="i18n.lang() === 'fr'" aria-hidden="true">
          <svg viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice" focusable="false">
            <rect width="1" height="2" fill="#002395" />
            <rect x="1" width="1" height="2" fill="#ffffff" />
            <rect x="2" width="1" height="2" fill="#ed2939" />
          </svg>
        </span>
        <span class="flag" [class.is-on]="i18n.lang() === 'en'" aria-hidden="true">
          <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" focusable="false">
            <clipPath id="uk-diag"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" /></clipPath>
            <rect width="60" height="30" fill="#012169" />
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6" />
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-diag)" stroke="#c8102e" stroke-width="4" />
            <path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10" />
            <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6" />
          </svg>
        </span>
      </button>

      <!-- Bascule du thème -->
      <button
        type="button"
        class="hud-action hud-theme"
        (click)="onThemeToggle()"
        [attr.aria-label]="themeLabel">
        @if (currentTheme === 'dark') {
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        } @else {
          <i class="fa-solid fa-sun" aria-hidden="true"></i>
        }
      </button>

    </div>

  </div>
</header>
